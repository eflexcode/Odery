spring:
  application:
    name: UserService
  datasource:
    url: jdbc:postgresql://localhost:5432/oderyUser
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8095

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8085/eureka