spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
  application:
    name: Gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/oderyUser
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8085/eureka
